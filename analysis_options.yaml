analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
linter:
  rules:
    - avoid_print
    - always_declare_return_types
    - avoid_relative_lib_imports
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - test_types_in_equals