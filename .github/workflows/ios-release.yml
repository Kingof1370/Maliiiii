name: iOS Release IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "lib/**"
      - "ios/**"
      - "pubspec.yaml"
      - ".github/workflows/ios-release.yml"

jobs:
  build-ipa:
    name: Build and publish unsigned IPA
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"

      - name: Get dependencies
        run: flutter pub get

      - name: Read version
        id: version
        run: echo "ver=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Build Runner.app (no codesign)
        run: flutter build ios --release --no-codesign

      - name: List build output
        run: ls -laR build/ios/ | head -60

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          APP_DIR="build/ios/iphoneos"
          if [ -d "$APP_DIR/Runner.app" ]; then
            rm -rf Payload maliiiii-ios.ipa
            mkdir -p Payload
            cp -R "$APP_DIR/Runner.app" Payload/
            zip -qry maliiiii-ios.ipa Payload
            ls -lh maliiiii-ios.ipa
          else
            echo "Runner.app NOT FOUND at $APP_DIR"
            find build -maxdepth 4 -type d -name "*.app" -print
            exit 1
          fi

      - name: Create Release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v${{ steps.version.outputs.ver }}
          name: مالیار iOS ${{ steps.version.outputs.ver }} (IPA بدون امضا)
          body: |
            فایل IPA نسخهٔ ${{ steps.version.outputs.ver }} ساخته‌شده با Flutter 3.47.
            - نصب: AltStore یا Sideloadly + اپل‌آیدی شخصی (هر ۷ روز تمدید)
            - انتشار رسمی: نیاز به اکانت Apple Developer (TestFlight / App Store)
          files: maliiiii-ios.ipa
          fail_on_unmatched_files: true
