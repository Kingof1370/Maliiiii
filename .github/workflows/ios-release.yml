name: iOS Release IPA

# ساخت فایل IPA (بدون امضا) روی macOS رانر گیت‌هاب برای نصب روی آیفون
# از طریق AltStore / Sideloadly با اپل‌آیدی شخصی، یا امضای نهایی برای
# TestFlight / App Store با اکانت توسعه‌دهنده.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"

      - name: Get dependencies
        run: flutter pub get

      - name: Build unsigned IPA
        run: flutter build ipa --no-codesign --release

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: maliiiii-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
